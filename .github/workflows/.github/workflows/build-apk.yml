name: Build Trade Safe AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Принять лицензии Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Установить Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Распаковать проект
        run: |
          unzip -q TradeSafeAI_GitHubActions.zip
          cd TradeSafeAI
          echo "Проект распакован"

      - name: Исправить JVM target Java/Kotlin
        shell: bash
        run: |
          set -e
          cd TradeSafeAI

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("build.gradle")) + list(Path(".").rglob("build.gradle.kts"))

          for p in files:
              text = p.read_text(encoding="utf-8")
              original = text

              text = re.sub(
                  r'sourceCompatibility\s*=\s*(?:JavaVersion\.)?VERSION_1_8',
                  'sourceCompatibility = JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'targetCompatibility\s*=\s*(?:JavaVersion\.)?VERSION_1_8',
                  'targetCompatibility = JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'sourceCompatibility\s+JavaVersion\.VERSION_1_8',
                  'sourceCompatibility JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'targetCompatibility\s+JavaVersion\.VERSION_1_8',
                  'targetCompatibility JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'jvmTarget\s*=\s*[\'"]1\.8[\'"]',
                  "jvmTarget = '17'",
                  text
              )

              text = re.sub(
                  r'jvmTarget\s*=\s*[\'"]8[\'"]',
                  "jvmTarget = '17'",
                  text
              )

              if text != original:
                  p.write_text(text, encoding="utf-8")
                  print(f"Исправлен: {p}")
          PY

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Проверить Java
        run: |
          java -version
          javac -version

      - name: Собрать APK
        run: |
          cd TradeSafeAI
          gradle --no-daemon clean assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeSafeAI-APK
          path: TradeSafeAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
