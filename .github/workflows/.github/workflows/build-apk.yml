name: Build Trade Safe AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Распаковать проект
        run: |
          unzip -q -o TradeSafeAI_GitHubActions.zip
          cd TradeSafeAI
          echo "Проект распакован"
          java -version

      - name: Принудительно установить Java 17
        run: |
          cd TradeSafeAI

          echo "Настраиваем JavaCompile на JVM 17..."

          find . -name "build.gradle" -type f -print0 | while IFS= read -r -d '' file; do
            cat >> "$file" <<'EOF'

/* GitHub Actions - force Java 17 */
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = "17"
    targetCompatibility = "17"
    options.release = 17
}
EOF
          done

          find . -name "build.gradle.kts" -type f -print0 | while IFS= read -r -d '' file; do
            cat >> "$file" <<'EOF'

/* GitHub Actions - force Java 17 */
tasks.withType<JavaCompile>().configureEach {
    sourceCompatibility = "17"
    targetCompatibility = "17"
    options.release.set(17)
}
EOF
          done

          echo "Java 17 принудительно установлена."

      - name: Установить Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Проверить Java и Kotlin
        run: |
          cd TradeSafeAI
          gradle --no-daemon tasks

      - name: Собрать APK
        run: |
          cd TradeSafeAI
          gradle --no-daemon assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeSafeAI-APK
          path: TradeSafeAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
