name: Build Trade Safe AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          which sdkmanager
          sdkmanager --version

      - name: Принять лицензии Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true

      - name: Установить Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Распаковать проект
        run: |
          unzip -q TradeSafeAI_GitHubActions.zip
          cd TradeSafeAI
          echo "Проект распакован"

      - name: Создать принудительную настройку Java 17
        shell: bash
        run: |
          cd TradeSafeAI

          cat > force-java17.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.projectsEvaluated {

              allprojects { project ->

                  // Принудительно Java 17 для всех JavaCompile
                  project.tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }

                  // Android Gradle Plugin
                  def androidExtension = project.extensions.findByName("android")

                  if (androidExtension != null) {
                      androidExtension.compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }

                  // Kotlin
                  project.tasks.configureEach { task ->

                      if (task.class.name.contains("KotlinCompile")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

          echo "force-java17.gradle создан"

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Проверить Java
        run: |
          java -version
          javac -version

      - name: Собрать APK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          cd TradeSafeAI

          gradle \
            --no-daemon \
            --init-script force-java17.gradle \
            clean \
            assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeSafeAI-APK
          path: TradeSafeAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
