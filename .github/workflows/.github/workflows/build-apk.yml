name: Build Trade Safe AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          which sdkmanager
          sdkmanager --version

      - name: Принять лицензии Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses || true

      - name: Установить Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Распаковать проект
        run: |
          unzip -q TradeSafeAI_GitHubActions.zip
          cd TradeSafeAI
          echo "Проект распакован"

      - name: Исправить Java 8 -> Java 17
        shell: bash
        run: |
          set -e

          cd TradeSafeAI

          echo "=== Gradle files ==="
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \)

          echo "=== Исправляем Java 8 ==="

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("build.gradle"))
          files += list(Path(".").rglob("build.gradle.kts"))

          for p in files:
              text = p.read_text(encoding="utf-8")
              original = text

              # JavaVersion.VERSION_1_8 -> VERSION_17
              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "JavaVersion.VERSION_8",
                  "JavaVersion.VERSION_17"
              )

              # sourceCompatibility 1.8
              text = re.sub(
                  r'(sourceCompatibility\s+)([\'"]?1\.8[\'"]?)',
                  r'\1JavaVersion.VERSION_17',
                  text
              )

              # targetCompatibility 1.8
              text = re.sub(
                  r'(targetCompatibility\s+)([\'"]?1\.8[\'"]?)',
                  r'\1JavaVersion.VERSION_17',
                  text
              )

              # sourceCompatibility = '1.8'
              text = re.sub(
                  r'(sourceCompatibility\s*=\s*)[\'"]1\.8[\'"]',
                  r'\1JavaVersion.VERSION_17',
                  text
              )

              # targetCompatibility = '1.8'
              text = re.sub(
                  r'(targetCompatibility\s*=\s*)[\'"]1\.8[\'"]',
                  r'\1JavaVersion.VERSION_17',
                  text
              )

              # Kotlin jvmTarget 1.8
              text = re.sub(
                  r'(jvmTarget\s*=\s*)[\'"]1\.8[\'"]',
                  r"\1'17'",
                  text
              )

              text = re.sub(
                  r'(jvmTarget\s*=\s*)[\'"]8[\'"]',
                  r"\1'17'",
                  text
              )

              if text != original:
                  p.write_text(text, encoding="utf-8")
                  print("ИСПРАВЛЕН:", p)

          PY

          echo "=== Проверяем, остался ли Java 8 ==="

          grep -RniE \
            "VERSION_1_8|VERSION_8|sourceCompatibility.*1\.8|targetCompatibility.*1\.8|jvmTarget.*1\.8" \
            . \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            || true

      - name: Принудительно настроить JVM 17
        shell: bash
        run: |
          cd TradeSafeAI

          cat > force-java17.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach {
                  if (name.toLowerCase().contains("kotlin")) {
                      try {
                          if (hasProperty("kotlinOptions")) {
                              kotlinOptions.jvmTarget = "17"
                          }
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

          echo "Создан force-java17.gradle"

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Проверить Java
        run: |
          java -version
          javac -version

      - name: Собрать APK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          cd TradeSafeAI

          gradle \
            --no-daemon \
            --init-script force-java17.gradle \
            clean \
            assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeSafeAI-APK
          path: TradeSafeAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
