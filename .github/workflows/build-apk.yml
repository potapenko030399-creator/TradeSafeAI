name: Build Trade Safe AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Распаковать проект
        run: |
          unzip -q TradeSafeAI_GitHubActions.zip
          cd TradeSafeAI
          echo "Проект распакован"

      - name: Установить Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Собрать APK
        run: |
          cd TradeSafeAI
          gradle --no-daemon assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeSafeAI-APK
          path: TradeSafeAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
